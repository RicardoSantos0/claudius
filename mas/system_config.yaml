# ============================================================
# SYSTEM CONFIGURATION — MASTER CONFIG FILE
# ============================================================

system:
  name: "Governed Multi-Agent Delivery System"
  version: "0.2.0"
  created_at: "2026-04-09T00:00:00Z"
  governance_mode: "strict"  # strict | permissive

# --- PATHS ---
paths:
  root: "./"
  roster: "roster/"
  policies: "policies/"
  templates: "templates/"
  projects: "projects/"
  foundation: "foundation/"
  agents: "agents/"
  core: "core/"
  tests: "tests/"
  audit_log: "audit.log"
  domains: "domains/"

# --- DEFAULTS ---
defaults:
  trainer_authority_level: "L0_advisory"
  spawn_mode: "draft_only"
  max_spawns_per_project: 3
  max_spawns_per_phase: 1
  recursive_spawn_allowed: false
  max_clarification_rounds: 3
  max_questions_per_round: 7
  specification_quality_threshold: 0.85
  capability_match_threshold_strong: 80
  capability_match_threshold_partial: 50
  agent_probation_threshold: 60
  max_agent_retries: 1
  consultation_max_response_words: 500
  consultation_max_followup_rounds: 1
  phase_snapshot_enabled: true

# --- LLM CONFIGURATION ---
llm:
  provider: "anthropic"
  master_model: "claude-opus-5-5"        # Legacy reasoning fallback
  default_model: "claude-sonnet-5-5"     # Legacy standard fallback
  # Provider-neutral semantic routing. Profile targets are configurable and
  # may use different providers; MAS_<PROFILE>_{PROVIDER,MODEL} env vars win.
  # Tiering rule: planning and judgement work routes to the
  # reasoning tier, execution work to the cheaper standard/economy tiers.
  execution_profiles:
    reasoning:
      provider: "anthropic"
      model: "claude-opus-5-5"
      fallbacks:
        - provider: "anthropic"
          model: "claude-fable-5-1"
          opencode_model: "claude-fable-5-1"
          "on": ["model_unavailable", "refusal"]
    standard:
      provider: "anthropic"
      model: "claude-sonnet-5-5"
    economy:
      provider: "anthropic"
      model: "claude-haiku-4-5-20251001"
  # Provider catalogs let the same semantic route target multiple vendors.
  # Gemini identifiers are LiteLLM model IDs; no credentials are stored here.
  default_provider_catalog: "anthropic"
  provider_catalogs:
    anthropic:
      adapter: "anthropic"
      provider: "anthropic"
      opencode_provider: "anthropic"
      source_url: "https://platform.claude.com/docs/en/models/overview"
      validated_at: "2026-10-04"
      lifecycle_state: "active"
      credential_env: "ANTHROPIC_API_KEY"
      # Source recommends Opus 5.5 for most workloads and Fable 5.1 where Opus
      # at higher effort falls short. Haiku 4.5 retires not sooner than
      # 2026-10-15; revisit the economy tier when a successor is listed.
      profiles:
        reasoning:
          provider: "anthropic"
          model: "claude-opus-5-5"
          opencode_model: "claude-opus-5-5"
          fallbacks:
            - provider: "anthropic"
              model: "claude-fable-5-1"
              opencode_model: "claude-fable-5-1"
              "on": ["model_unavailable", "refusal"]
        standard: {provider: "anthropic", model: "claude-sonnet-5-5", opencode_model: "claude-sonnet-5-5"}
        economy: {provider: "anthropic", model: "claude-haiku-4-5-20251001", opencode_model: "claude-haiku-4-5-20251001"}
    openai:
      adapter: "openai"
      provider: "openai"
      opencode_provider: "openai"
      source_url: "https://developers.openai.com/api/docs/models"
      validated_at: "2026-10-04"
      lifecycle_state: "active"
      credential_env: "OPENAI_API_KEY"
      # Current lineup: Astra (most capable), 6.1 Sol (near-Astra, balanced), Luna
      # (most efficient). The 5.6 Sol/Terra/Luna family has left the current page
      # without a deprecation notice. The fallback reuses 6.1 Sol at high effort.
      profiles:
        reasoning:
          provider: "openai"
          model: "gpt-6-astra"
          reasoning_effort: "high"
          opencode_model: "gpt-6-astra"
          fallbacks:
            - provider: "openai"
              model: "gpt-6.1-sol"
              reasoning_effort: "high"
              opencode_model: "gpt-6.1-sol"
              "on": ["model_unavailable", "refusal"]
        standard: {provider: "openai", model: "gpt-6.1-sol", reasoning_effort: "medium", opencode_model: "gpt-6.1-sol"}
        economy: {provider: "openai", model: "gpt-6-luna", reasoning_effort: "low", opencode_model: "gpt-6-luna"}
    gemini:
      adapter: "litellm"
      provider: "litellm"
      opencode_provider: "google"
      source_url: "https://ai.google.dev/gemini-api/docs/models"
      validated_at: "2026-10-04"
      lifecycle_state: "active"
      credential_env: "GEMINI_API_KEY"
      # Google has no generally available Pro text model; gemini-3.1-pro-preview is
      # preview-only and excluded. 3.8 Flash is Google's most intelligent GA model.
      profiles:
        reasoning:
          provider: "litellm"
          model: "gemini/gemini-3.8-flash"
          reasoning_effort: "high"
          opencode_model: "gemini-3.8-flash"
          fallbacks:
            - provider: "litellm"
              model: "gemini/gemini-3.7-flash"
              reasoning_effort: "high"
              opencode_model: "gemini-3.7-flash"
              "on": ["model_unavailable", "refusal"]
        standard: {provider: "litellm", model: "gemini/gemini-3.7-flash", reasoning_effort: "medium", opencode_model: "gemini-3.7-flash"}
        economy: {provider: "litellm", model: "gemini/gemini-3.5-flash-lite", reasoning_effort: "low", opencode_model: "gemini-3.5-flash-lite"}
    ollama:
      # Example local catalogue for Ollama. Pull the models first
      # (`ollama pull qwen3.6`, etc.) or edit the tags to what `ollama list` shows.
      # Provider "ollama" uses the OpenAI-compatible adapter at
      # http://localhost:11434/v1 (override with MAS_OLLAMA_BASE_URL), so local runs
      # are labelled ollama in receipts rather than openai. No credential.
      adapter: "openai_compatible"
      provider: "ollama"
      opencode_provider: "ollama"
      source_url: "https://ollama.com/library"
      validated_at: "2026-10-04"
      lifecycle_state: "active"
      # Readiness variable, not a secret: runs default to localhost without it,
      # while the opt-in live canary skips until it is set.
      credential_env: "MAS_OLLAMA_BASE_URL"
      profiles:
        reasoning:
          # qwen3.6: 36B MoE with thinking and tools.
          provider: "ollama"
          model: "qwen3.6:latest"
          opencode_model: "qwen3.6:latest"
          fallbacks:
            - provider: "ollama"
              model: "gemma4:26b"
              opencode_model: "gemma4:26b"
              "on": ["model_unavailable", "refusal"]
        # qwen3-coder-next: coding specialist for delivery work.
        standard: {provider: "ollama", model: "qwen3-coder-next:latest", opencode_model: "qwen3-coder-next:latest"}
        # lfm2: small and fast, for clerical work.
        economy: {provider: "ollama", model: "lfm2:latest", opencode_model: "lfm2:latest"}
  phase_profiles:
    intake: "reasoning"
    specification: "reasoning"
    planning: "reasoning"
    capability_discovery: "standard"
    execution: "economy"
    review: "reasoning"
    validation: "standard"
    evaluation: "reasoning"
    training: "standard"
    improvement: "economy"
    closure: "economy"
    closed: "economy"
  routing:
    audit_persistence: "best_effort"
    catalog_lifecycle:
      enabled: true
      max_age_days: 92
    risk_escalation_levels: ["high", "critical"]
    retry_escalation_threshold: 1
    critical_agents: ["reliability_engineer"]
    critical_agent_profile: "reasoning"
    risk_escalation_profile: "reasoning"
    retry_escalation_profile: "standard"
    manual_enforcement_capability: "recommended"
    receipt_required_profiles: ["reasoning"]
  # First-class manual client surfaces. Capability describes whether a host can
  # apply the route; manual selection remains unverified until receipt ingestion.
  surfaces:
    generic:
      adapter: "manual"
      enforcement_capability: "recommended"
      profiles: {}
    claude:
      adapter: "claude_code_subagent"
      catalog: "anthropic"
      enforcement_capability: "client_selectable"
      profiles: {}
    copilot:
      # Copilot selectors are lowercase with dotted versions and no date suffix;
      # Anthropic API IDs (claude-opus-5-5) are not accepted and an unknown
      # --model silently falls back to another model. These ids appear in both the
      # free and paid Copilot catalogues as of 2026-10-04; check your account's
      # list (VS Code model picker or Copilot CLI /model) and edit if it differs.
      adapter: "github_copilot_agent"
      catalog: "inherit"
      enforcement_capability: "advisory"
      profiles:
        reasoning:
          provider: "github_copilot"
          model: "claude-sonnet-5.5"
          launch_args: ["--model", "{model}"]
          fallbacks:
            - provider: "github_copilot"
              model: "claude-sonnet-5"
              "on": ["model_unavailable", "refusal"]
        standard:
          provider: "github_copilot"
          model: "gemini-3.8-flash"
          launch_args: ["--model", "{model}"]
        economy:
          provider: "github_copilot"
          model: "gpt-6-luna"
          launch_args: ["--model", "{model}"]
    codex:
      # Each tier launches a Codex profile file ~/.codex/mas-<profile>.config.toml
      # that pins model and model_reasoning_effort, so the user's global default in
      # ~/.codex/config.toml is left untouched. Create one file per tier.
      adapter: "codex_config"
      catalog: "openai"
      enforcement_capability: "client_selectable"
      profiles:
        reasoning:
          provider: "openai"
          model: "gpt-6-astra"
          reasoning_effort: "high"
          launch_args: ["--profile", "mas-{profile}", "-m", "{model}"]
          fallbacks:
            - provider: "openai"
              model: "gpt-6.1-sol"
              reasoning_effort: "high"
              "on": ["model_unavailable", "refusal"]
        standard:
          provider: "openai"
          model: "gpt-6.1-sol"
          reasoning_effort: "medium"
          launch_args: ["--profile", "mas-{profile}", "-m", "{model}"]
        economy:
          provider: "openai"
          model: "gpt-6-luna"
          reasoning_effort: "low"
          launch_args: ["--profile", "mas-{profile}", "-m", "{model}"]
    antigravity:
      # Gemini runs through Google Antigravity, whose CLI `agy` replaces the Gemini
      # CLI. Ids come from `agy models`; these are offered on every Antigravity plan
      # (Opus 5.5 needs Google AI Ultra), so Opus 4.6 carries the reasoning tier.
      # Gemini ids embed their thinking level; --effort applies to the Claude route.
      adapter: "antigravity_cli"
      catalog: "gemini"
      enforcement_capability: "client_selectable"
      profiles:
        reasoning:
          provider: "google_antigravity"
          model: "claude-opus-4-6-thinking"
          reasoning_effort: "high"
          launch_args: ["--model", "{model}", "--effort", "high"]
          fallbacks:
            - provider: "google_antigravity"
              model: "gemini-3.1-pro-high"
              "on": ["model_unavailable", "refusal"]
        standard:
          provider: "google_antigravity"
          model: "gemini-3.8-flash-medium"
          launch_args: ["--model", "{model}"]
        economy:
          provider: "google_antigravity"
          model: "gemini-3.6-flash-low"
          launch_args: ["--model", "{model}"]
    opencode:
      # Inherits the selected catalogue and exposes `-m provider/model`. Point it at
      # the ollama catalogue when opencode has no cloud credentials.
      adapter: "opencode_cli"
      catalog: "inherit"
      enforcement_capability: "client_selectable"
      profiles: {}
    local:
      adapter: "openai_compatible"
      catalog: "ollama"
      enforcement_capability: "client_selectable"
      profiles: {}
  max_tokens: 4096
  temperature: 0.3
  # Role tiers: planning and judgement roles keep the
  # reasoning profile in every phase; execution roles use cheaper tiers.
  # Risk, critical-agent and retry escalation still outrank these overrides, so
  # reliability_engineer stays on reasoning via routing.critical_agents, and
  # delivery engineers added to a workspace should use "standard". Roles not listed (the consultant panel) follow
  # phase_profiles. Agent frontmatter stays `model: inherit` (provider-agnostic,
  # enforced by scripts/validate_agents.py); these overrides are the only place a
  # role's tier is set.
  # The selected surface/catalog still determines the concrete provider family.
  agent_overrides:
    master_orchestrator: "reasoning"
    inquirer_agent: "reasoning"
    product_manager_agent: "reasoning"
    project_manager_agent: "reasoning"
    hr_agent: "reasoning"
    spawner_agent: "reasoning"
    evaluator_agent: "reasoning"
    trainer_agent: "reasoning"
    scribe_agent: "economy"
    session_scheduler: "economy"

# --- TRUST TIERS ---
trust_tiers:
  # Canonical trust tier definitions — registry_index.yaml is the single source of truth
  # for per-agent tier assignments. This block exists for documentation only.
  T0_core:
    name: "Core"
    agents: ["master_orchestrator", "scribe_agent", "hr_agent"]
    can_do: "Full authority within role boundaries"
    cannot_do: "N/A within role"
  T1_established:
    name: "Established"
    agents:
      - "inquirer_agent"
      - "product_manager_agent"
      - "project_manager_agent"
      - "evaluator_agent"
      - "trainer_agent"
      - "risk_advisor"
      - "quality_advisor"
      - "devils_advocate"
      - "domain_expert"
      - "efficiency_advisor"
      - "reliability_engineer"
      - "session_scheduler"
    can_do: "Operate independently within role boundaries"
    cannot_do: "Spawn, change governance, modify other agents"
  T2_supervised:
    name: "Supervised"
    agents: ["spawner_agent"]
    can_do: "Operate with Master oversight"
    cannot_do: "Act without Master confirmation on high-impact actions"
  T3_provisional:
    name: "Provisional"
    agents: []  # Spawned agents start here
    can_do: "Operate in sandbox only"
    cannot_do: "Access production state, interact externally unsupervised"

# --- HUMAN APPROVAL ---
human_approval:
  mechanism: "cli"  # cli | api | ui
  timeout_behavior: "pause_project"
  required_for:
    - "trust_tier_promotion"
    - "governance_policy_changes"
    - "unanimous_consultant_risk_override"
    - "critical_risk_classification"
    - "trainer_L1_promotion"
    - "trainer_L2_promotion"

# --- STORAGE ---
storage:
  provider: "filesystem"
  format: "yaml"
  backup_enabled: false
  snapshot_retention:
    delete_on_close: true
    keep_latest_after_close: 0
    write_final_state_copy: true
  database:
    provider: "sqlite"
    url: "sqlite:///mas/data/episodic.db"
    target_provider: "postgresql"
    postgres_url: ""
  vector:
    provider: "chromadb"
    enabled: false
    collection: "mas-agent-context"
    persist_directory: "mas/data/chromadb"
    host: ""
    port: 8000

# --- AUDIT ---
audit:
  enabled: true
  log_file: "audit.log"
  log_format: "structured_yaml"
  log_events:
    - "message_sent"
    - "state_write"
    - "governance_violation"
    - "handoff_created"
    - "handoff_accepted"
    - "handoff_rejected"
    - "spawn_request"
    - "spawn_result"
    - "consultation_request"
    - "consultation_synthesis"
    - "phase_transition"
    - "error"
    - "human_escalation"
    - "human_approval"

# --- COMMUNICATION / TOKEN TRACKING ---
communication:
  token_tracking_enabled: true
  token_counter_backend: "heuristic"   # heuristic | tiktoken
  token_counter_model: "cl100k_base"   # used only if backend = tiktoken
  wire_protocol_enabled: true
  wire_protocol_version: "1.0"
  wire_compliance_enforcement: "metric"  # metric (never governance violation)
  consultation_reasoning_max_words: 100  # optional reasoning field cap (wire rsn)

# --- SKILL BRIDGE ---
skill_access:
  enabled: true
  skills_dir: "../skills"               # relative to mas/
  audit_log: "projects/{project_id}/skill_audit_log.yaml"
  unauthorized_outcome: "denied"         # denied (never governance violation for skill access)
  # Keep this mapping aligned with core/engine/skill_bridge.py::SKILL_ACCESS.
  per_agent_access:
    master_orchestrator: ["*"]           # all skills
    scribe_agent: ["research-extract", "research-sync", "mas-document", "mas-handoff"]
    inquirer_agent: ["research-extract", "mas-clarify"]
    product_manager_agent: ["research-extract", "research-sync", "mas-clarify"]
    project_manager_agent: ["research-extract", "mas-plan", "mas-examine"]
    hr_agent: []
    evaluator_agent: ["research-extract", "mas-postmortem"]
    trainer_agent: ["mas-postmortem"]
    spawner_agent: ["skill-builder"]
    risk_advisor: ["mas-examine"]
    quality_advisor: ["mas-examine"]
    devils_advocate: []
    domain_expert: ["research-extract", "mas-examine"]
    efficiency_advisor: []
    session_scheduler: ["mas-review", "mas-handoff", "mas-logwork"]
